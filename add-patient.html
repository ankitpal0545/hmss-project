<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient | Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>HMS</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="patients.html" class="nav-link active">Patients</a>
                <a href="doctors.html" class="nav-link">Doctors</a>
                <a href="appointments.html" class="nav-link">Appointments</a>
                <a href="medicines.html" class="nav-link">Medicines</a>
                <a href="billing.html" class="nav-link">Billing</a>
            </nav>

            <div class="sidebar-bottom">
                <a href="#" class="nav-link settings-link">Settings</a>
                <a href="login.html" class="nav-link logout">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Add Patient</h1>
                    <p>Register a new patient</p>
                </div>
                <div class="header-right">
                    <button class="notification-btn" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
                    <div class="user-profile">
                        <div class="user-avatar">A</div>
                        <div>
                            <strong>Admin</strong>
                            <small>Administrator</small>
                        </div>
                    </div>
                </div>
            </header>

            <section class="dashboard-card form-card">
                <div class="card-header">
                    <div>
                        <h3>Patient Details</h3>
                        <p>Enter patient details</p>
                    </div>
                </div>
                <form id="patientForm">
                    <div class="form-grid">
                    <div class="form-field"><label>Name</label><input type="text" id="name" required></div>
                    <div class="form-field"><label>Age</label><input type="number" id="age" min="0" max="150" required></div>
                    <div class="form-field"><label>Gender</label><select id="gender" required><option value="">Select Gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
                    <div class="form-field"><label>Phone</label><input type="text" id="phone" pattern="\d{10}" title="10 digit phone number" required></div>
                    <div class="form-field"><label>Email</label><input type="email" id="email"></div>
                    <div class="form-field"><label>Address</label><input type="text" id="address"></div>
                    <div class="form-field"><label>Blood Group</label><select id="blood_group" required><option value="">Select Blood Group</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="add-patient-btn">Add Patient</button>
                        <a href="patients.html" class="btn-secondary">Back to Patients</a>
                    </div>
                </form>
                <p id="message" class="form-message"></p>
            </section>

            <footer class="dashboard-footer">
                <p>&copy; 2026 Hospital Management System</p>
            </footer>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/add-patient.js"></script>
</body>
</html>
