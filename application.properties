server.port=8080
spring.application.name=hospital-management-system

# ---- Database: H2 file database (works out of the box, data saved in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/hmsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---- To use MySQL instead: comment the H2 lines above and uncomment these ----
#spring.datasource.url=jdbc:mysql://localhost:3306/hms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON uses snake_case (patient_id, blood_group ...) to match the frontend
spring.jackson.property-naming-strategy=SNAKE_CASE
